
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birthday My Love</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle, #572078, #100824, #03020d);
  color: white;
  font-family: cursive;
  text-align: center;
}

h1 {
  margin-top: 80px;
  color: #ffb9ed;
  font-size: 34px;
  text-shadow: 0 0 15px #ff38d1;
  animation: glow 2s infinite alternate;
}

p { font-size: 18px; }

.cake {
  margin: 100px auto 0;
  width: 180px;
  height: 90px;
  position: relative;
  background: linear-gradient(#ffb1e5 0 20%, #ff4d96 20% 40%, #79334e 40%);
  border-radius: 12px 12px 5px 5px;
  box-shadow: 0 0 35px #ff48c4;
}

.candle {
  position: absolute;
  width: 18px;
  height: 65px;
  background: repeating-linear-gradient(
    45deg, white 0 10px, #ff477f 10px 20px
  );
  bottom: 90px;
  left: 81px;
  border-radius: 5px;
}

.flame {
  position: absolute;
  width: 22px;
  height: 30px;
  background: #ffe76a;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  top: -28px;
  left: -2px;
  box-shadow: 0 0 25px orange;
  animation: flicker .5s infinite alternate;
}

button {
  margin-top: 35px;
  padding: 14px 25px;
  border: 0;
  border-radius: 30px;
  color: white;
  background: #ff299b;
  font-size: 17px;
  box-shadow: 0 0 20px #ff299b;
}

.heart {
  position: absolute;
  bottom: -40px;
  color: #ff69cb;
  font-size: 25px;
  animation: rise 6s linear infinite;
}

@keyframes glow {
  to { text-shadow: 0 0 30px #ff00c8; }
}

@keyframes flicker {
  to { transform: rotate(-35deg) scale(1.15); }
}

@keyframes rise {
  to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}
</style>
</head>

<body>
<h1>🎂 Happy Birthday!</h1>
<p>Chúc ba luôn hạnh phúc và tiền vô nhiều để nuôi gia đình💵</p>

<div class="cake">
  <div class="candle">
    <div class="flame"></div>
  </div>
</div>

<p>✨ Birthday My Dad ✨</p>

<button onclick="birthday()">👑 Nhấn vào đây 👑</button>

<script>
function birthday() {
  alert("Chúc mừng sinh nhật! 💵 Chúc ba luôn hạnh phúc!");
}

for (let i = 0; i < 25; i++) {
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "♥";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDelay = Math.random() * 6 + "s";
  heart.style.fontSize = (15 + Math.random() * 25) + "px";
  document.body.appendChild(heart);
}
</script>
</body>
</html>
